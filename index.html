<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0E1013" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="manifest" href="./manifest.json" />
<title>Drakars</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0E1013;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px 12px 76px;min-height:100vh}
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .dot{width:9px;height:9px;border-radius:50%;background:#7EE823;box-shadow:0 0 8px #7EE823}
  .dot.pc-off{background:#F59E0B;box-shadow:0 0 8px #F59E0B}
  .mod-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#16191E;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px;margin-bottom:10px}
  .mod-btn{background:transparent;border:none;border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer}
  .mod-btn.act-work{background:#233217;color:#9AF549}
  .mod-btn.act-home{background:#351A2A;color:#FDA4AF}
  .mod-btn.act-dev{background:#2A1842;color:#D8B4FE}
  .card{background:#16191E;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#1D2128;margin-bottom:6px}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;color:#000;font-weight:900;font-size:13px}
  .chk.done{background:#7EE823;border-color:#7EE823}
  .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
  .ttl.done{text-decoration:line-through;color:rgba(255,255,255,.45)}
  .sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;line-height:1.45}
  .form{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  input,select{flex:1;min-width:85px;background:#111318;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 11px;color:#fff;font-size:13px;outline:none}
  .btn{background:#7EE823;color:#000;border:none;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer}
  .btn-rose{background:#F43F5E;color:#fff}
  .btn-dev{background:#A855F7;color:#fff}
  .btn2{background:rgba(255,255,255,.09);color:#fff;border:none;border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;text-decoration:none}
  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .kpi{background:#1D2128;border-radius:12px;padding:8px;text-align:center}
  .kpi .lbl{font-size:10px;color:rgba(255,255,255,.55)}
  .kpi .val{font-size:12.5px;font-weight:800;margin-top:2px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111317;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding:8px 4px;z-index:20}
  .nav button{background:none;border:none;color:rgba(255,255,255,.55);font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:10px;cursor:pointer}
  .nav button.act{background:rgba(255,255,255,.12);color:#fff}
  .banner{font-size:11px;color:#FCD34D;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:8px 10px;margin-bottom:10px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="brand">
      <img src="./icon.svg" width="24" height="24" alt="" style="border-radius:6px" />
      <span>Drakars</span>
      <span class="dot" id="pcDot"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn2" onclick="sync()">↻</button>
      <span class="btn2" id="lvl">Nv1</span>
    </div>
  </div>
  <div class="mod-bar">
    <button class="mod-btn" id="m-work" onclick="setMod('work')">CDHU</button>
    <button class="mod-btn" id="m-home" onclick="setMod('home')">Home</button>
    <button class="mod-btn" id="m-dev" onclick="setMod('dev')">Dev</button>
  </div>
  <div id="banner"></div>
  <div id="content"></div>
  <div class="nav" id="nav"></div>
<script>
const CFG_KEY="drakars_cloud_cfg", DATA_KEY="drakars_cloud_data", MOD_KEY="drakars_mob_mod";
const BANK_COLORS={nubank:"#820AD1",itau:"#EC7000",bradesco:"#CC092F",santander:"#EC0000",bb:"#FFCC00",caixa:"#005CA9",inter:"#FF7A00",c6:"#27272A",btg:"#001E62",xp:"#FFD000",mercadopago:"#009EE3",picpay:"#21C25E",pagbank:"#00A868",sicredi:"#3FA110",sicoob:"#003641",wise:"#9FE870",nomad:"#C9A227"};
let mod=localStorage.getItem(MOD_KEY)||"work", subTab="", cfg=null, data=null;

function readConfig(){
  if(location.hash && location.hash.length>1){
    const p=new URLSearchParams(location.hash.slice(1));
    const gistId=p.get("gist"), token=p.get("token");
    if(gistId && token){
      const next={gistId,token};
      localStorage.setItem(CFG_KEY, JSON.stringify(next));
      const isStandalone=(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
      if(isStandalone) history.replaceState(null,"",location.pathname+location.search);
      return next;
    }
  }
  try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch{ return null; }
}
cfg=readConfig();
try{ const c=localStorage.getItem(DATA_KEY); if(c) data=JSON.parse(c); }catch{}
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }

function setMod(m){
  mod=m;
  localStorage.setItem(MOD_KEY,m);
  subTab="";
  render();
}
function setSub(s){ subTab=s; render(); }

async function fetchGist(){
  if(!cfg) return null;
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const g=await r.json();
  const txt=g.files && g.files["drakars-sync.json"] && g.files["drakars-sync.json"].content;
  return txt ? JSON.parse(txt) : null;
}
async function patchGist(nextData){
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{
    method:"PATCH",
    headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token,"Content-Type":"application/json"},
    body:JSON.stringify({files:{"drakars-sync.json":{content:JSON.stringify(nextData,null,2)}}})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function sync(){
  if(!cfg){ render(); return; }
  try{
    const remote=await fetchGist();
    if(remote){ data=remote; localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
    render();
  }catch{ render("Modo offline (usando cache local)."); }
}
async function pushOp(type, payload, mutateLocal){
  if(!cfg || !data) return;
  const fresh=(await fetchGist().catch(()=>null)) || data;
  mutateLocal(fresh);
  fresh.pendingMobileOps=Array.isArray(fresh.pendingMobileOps)?fresh.pendingMobileOps:[];
  fresh.pendingMobileOps.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),type,payload,createdAt:Date.now()});
  fresh.updatedAt=Date.now();
  data=fresh; localStorage.setItem(DATA_KEY, JSON.stringify(data));
  render();
  await patchGist(fresh);
}

async function addTask(e, ws){
  e.preventDefault();
  const inp=document.getElementById("taskInp");
  const title=inp?inp.value.trim():"";
  if(!title) return; inp.value="";
  await pushOp("create_task",{title,category:ws==="dev"?"Clientes":ws==="home"?"Casa":"CDHU",workspace:ws},(d)=>{
    d.tasks=d.tasks||[]; d.tasks.unshift({id:"mob-"+Date.now(),title,priority:"medium",category:"Celular",workspace:ws,completed:false});
  });
}
async function toggleTask(id){ await pushOp("toggle_task",{id},(d)=>{ d.tasks=(d.tasks||[]).map(t=>t.id===id?{...t,completed:!t.completed}:t); }); }
async function checkinHabit(id){ await pushOp("checkin_habit",{id},(d)=>{ d.habits=(d.habits||[]).map(h=>h.id===id?{...h,doneToday:!h.doneToday}:h); }); }
async function addCal(e){
  e.preventDefault();
  const title=document.getElementById("calTitle").value.trim();
  const date=document.getElementById("calDate").value||new Date().toISOString().slice(0,10);
  const time=document.getElementById("calTime").value||"";
  if(!title) return; document.getElementById("calTitle").value="";
  await pushOp("add_calendar_event",{title,date,time,category:"casal",person:"casal"},(d)=>{
    d.calendarEvents=d.calendarEvents||[]; d.calendarEvents.unshift({id:"cal-"+Date.now(),title,date,time,category:"casal",person:"casal"});
  });
}
async function addShop(e){
  e.preventDefault();
  const title=document.getElementById("shopTitle").value.trim();
  if(!title) return; document.getElementById("shopTitle").value="";
  await pushOp("add_shopping_item",{title,category:"mercado"},(d)=>{
    d.shoppingList=d.shoppingList||[]; d.shoppingList.unshift({id:"sh-"+Date.now(),title,category:"mercado",checked:false});
  });
}
async function toggleShop(id){ await pushOp("toggle_shopping_item",{id},(d)=>{ d.shoppingList=(d.shoppingList||[]).map(s=>s.id===id?{...s,checked:!s.checked}:s); }); }
async function addLead(e){
  e.preventDefault();
  const name=document.getElementById("leadName").value.trim();
  const business=document.getElementById("leadBiz").value.trim();
  const val=parseFloat(String(document.getElementById("leadVal").value||"0").replace(",","."))||0;
  if(!name) return;
  document.getElementById("leadName").value=""; document.getElementById("leadBiz").value=""; document.getElementById("leadVal").value="";
  await pushOp("add_lead",{name,business,estimatedValue:val,projectType:"Landing Page",source:"Site de Captura"},(d)=>{
    d.leads=d.leads||[]; d.leads.unshift({id:"ld-"+Date.now(),name,business,estimatedValue:val,projectType:"Landing Page",status:"novo"});
  });
}
async function addReel(e){
  e.preventDefault();
  const title=document.getElementById("reelTitle").value.trim();
  const hook=document.getElementById("reelHook").value.trim();
  if(!title) return;
  document.getElementById("reelTitle").value=""; document.getElementById("reelHook").value="";
  await pushOp("add_reel",{title,hook:hook||("Gancho para "+title),format:"Reels"},(d)=>{
    d.reels=d.reels||[]; d.reels.unshift({id:"rl-"+Date.now(),title,hook:hook||title,format:"Reels",status:"ideia"});
  });
}
async function sendCmd(e){
  e.preventDefault();
  const inp=document.getElementById("cmdInp"); const text=inp?inp.value.trim():"";
  if(!text) return; inp.value="";
  await pushOp("send_chat",{text},()=>{});
  render("Comando enviado ao Drakars no PC!");
}
function saveManualCfg(e){
  e.preventDefault();
  const g=document.getElementById("cfgGist").value.trim(), t=document.getElementById("cfgTok").value.trim();
  if(g && t){ cfg={gistId:g,token:t}; localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); sync(); }
}
function fmtBrl(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}

function render(warn){
  ["work","home","dev"].forEach(m=>{
    const b=document.getElementById("m-"+m);
    if(b) b.className="mod-btn"+(mod===m?" act-"+m:"");
  });
  const tabsByMod={
    work:[["tasks","Tarefas"],["systems","Sistemas CDHU"],["agenda","Agenda"],["pc","Drakars IA"]],
    home:[["tasks","Tarefas"],["cal","Calendário"],["shop","Compras"],["finance","Espelho Azul"]],
    dev:[["leads","Leads"],["reels","Reels"],["tasks","Tarefas Dev"],["pc","Drakars IA"]]
  };
  const tabs=tabsByMod[mod]||tabsByMod.work;
  if(!subTab || !tabs.some(x=>x[0]===subTab)) subTab=tabs[0][0];
  document.getElementById("nav").innerHTML=tabs.map(([id,lbl])=>`<button class="${subTab===id?'act':''}" onclick="setSub('${id}')">${lbl}</button>`).join("");

  const el=document.getElementById("content"), ban=document.getElementById("banner");
  if(!cfg){
    ban.innerHTML="";
    el.innerHTML=`
      <div class="card">
        <div class="ttl" style="margin-bottom:6px">Conectar ao seu Drakars</div>
        <div class="sub" style="margin-bottom:10px">Nenhuma conta ou senha precisa ser criada aqui — basta escanear novamente o <b>QR Code na aba Celular do Drakars no PC</b>.<br><br>Dica no iPhone: depois de escanear, toque em <b>Compartilhar → Adicionar à Tela de Início</b> na mesma aba para salvar o pareamento automático.</div>
        <details>
          <summary class="sub" style="cursor:pointer;color:#9AF549;font-weight:700">Conexão manual (avançado)</summary>
          <form onsubmit="saveManualCfg(event)" style="margin-top:10px">
            <input id="cfgGist" placeholder="Gist ID" style="margin-bottom:8px;width:100%" />
            <input id="cfgTok" type="password" placeholder="Token GitHub (gist)" style="margin-bottom:8px;width:100%" />
            <button class="btn" type="submit" style="width:100%">Conectar</button>
          </form>
        </details>
      </div>`;
    return;
  }
  if(!data){ el.innerHTML='<div class="card"><div class="sub">Carregando dados da nuvem...</div></div>'; return; }

  const pcOnline=data.pcLastSeenAt && (Date.now()-data.pcLastSeenAt)<70000;
  document.getElementById("pcDot").className="dot"+(pcOnline?"":" pc-off");
  const pendAll=(data.tasks||[]).filter(t=>!t.completed);
  document.getElementById("lvl").textContent="Nv"+(data.level||1)+" • "+pendAll.length;
  const msgs=[]; if(!pcOnline) msgs.push("PC desligado/offline agora — alterações sincronizam na nuvem."); if(warn) msgs.push(warn);
  ban.innerHTML=msgs.length?'<div class="banner">'+msgs.join("<br>")+'</div>':'';

  const partner=data.partnerName||"Esposa";
  const today=new Date().toISOString().slice(0,10);
  const month=today.slice(0,7);

  if(subTab==="finance"){
    const txs=(data.transactions||[]).filter(t=>(t.date||"").startsWith(month));
    const fixedList=(data.fixedIncomes||[]).filter(f=>f.active!==false);
    const fixedInc=fixedList.reduce((a,b)=>a+Number(b.amount||0),0);
    const inc=txs.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount||0),0)+fixedInc;
    const exp=txs.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount||0),0)+(data.recurringBills||[]).reduce((a,b)=>a+Number(b.amount||0),0);
    const bal=inc-exp;
    const banks=data.bankAccounts||[], cards=data.creditCards||[], goals=data.savingsGoals||[];

    el.innerHTML=`
      <div class="card">
        <div class="sub" style="margin-bottom:6px;color:#FDA4AF;font-weight:700">ESPELHO DO NÓS NO AZUL (${month}) • Você & ${esc(partner)}</div>
        <div class="sub" style="margin-bottom:8px">Visualização automática do financeiro do casal. Para lançar gastos ou usar o atalho 2 Toques Atrás, acesse o app Nós no Azul.</div>
        <div class="kpi-grid">
          <div class="kpi"><div class="lbl">Entradas${fixedInc>0?' (+Fixo)':''}</div><div class="val" style="color:#9AF549">${fmtBrl(inc)}</div></div>
          <div class="kpi"><div class="lbl">Saídas + Fixas</div><div class="val" style="color:#FDA4AF">${fmtBrl(exp)}</div></div>
          <div class="kpi"><div class="lbl">Saldo Livre</div><div class="val" style="color:${bal>=0?'#9AF549':'#F87171'}">${fmtBrl(bal)}</div></div>
        </div>
        ${(banks.length||cards.length)?`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px">${banks.map(b=>`<div style="min-width:128px;background:#1D2128;border-left:4px solid ${BANK_COLORS[b.bankKey]||'#7EE823'};border-radius:10px;padding:7px 9px"><div class="sub" style="margin:0;color:#fff;font-weight:700">${esc(b.name)}</div><div style="font-size:12px;font-weight:800;color:#9AF549;margin-top:2px">${fmtBrl(b.balance)}</div></div>`).join("")}${cards.map(c=>`<div style="min-width:136px;background:#1D2128;border-left:4px solid ${BANK_COLORS[c.bankKey]||'#FB7185'};border-radius:10px;padding:7px 9px"><div class="sub" style="margin:0;color:#fff;font-weight:700">${esc(c.name)}</div><div style="font-size:11px;font-weight:700;color:#FDA4AF;margin-top:2px">Fat: ${fmtBrl(c.monthUsed)}</div></div>`).join("")}</div>`:''}
      </div>
      ${goals.length?`<div class="card"><div class="sub" style="margin-bottom:6px">METAS DO CASAL</div>${goals.map(g=>{const pct=Math.min(100,Math.round((Number(g.currentAmount||0)/Math.max(1,Number(g.targetAmount||1)))*100));return `<div class="row" style="flex-direction:column;align-items:stretch;gap:5px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${esc(g.title)}</span><span style="color:#9AF549">${pct}%</span></div><div style="height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${Math.max(4,pct)}%;background:linear-gradient(90deg,#FB7185,#7EE823)"></div></div><div class="sub" style="margin:0">${fmtBrl(g.currentAmount)} de ${fmtBrl(g.targetAmount)}</div></div>`;}).join("")}</div>`:''}
      <div class="card"><div class="sub" style="margin-bottom:6px">ÚLTIMOS LANÇAMENTOS REPLICADOS</div>${txs.slice(0,10).map(t=>`<div class="row"><div class="ttl">${esc(t.title)}<div class="sub">${t.date} • ${esc(t.category)} • ${t.paymentMethod||''}</div></div><b style="color:${t.type==='income'?'#9AF549':'#FDA4AF'};font-size:12.5px">${t.type==='income'?'+':'-'} ${fmtBrl(t.amount)}</b></div>`).join("")||'<div class="sub">Sem lançamentos no mês</div>'}</div>`;
  } else if(subTab==="cal"){
    const cals=(data.calendarEvents||[]).filter(c=>c.date>=today).slice(0,12);
    el.innerHTML=`<div class="card"><div class="sub" style="margin-bottom:6px">CALENDÁRIO PESSOAL & CASAL</div><form class="form" onsubmit="addCal(event)"><input id="calTitle" placeholder="Compromisso..." style="flex:2" /><input id="calDate" type="date" value="${today}" /><input id="calTime" type="time" /><button class="btn btn-rose" type="submit">+</button></form>${cals.map(c=>`<div class="row"><div class="ttl">${esc(c.title)}<div class="sub">${c.date}${c.time?' • '+c.time:''} • ${c.person}</div></div></div>`).join("")||'<div class="sub">Sem próximos eventos</div>'}</div>`;
  } else if(subTab==="shop"){
    const shops=data.shoppingList||[];
    el.innerHTML=`<div class="card"><div class="sub" style="margin-bottom:6px">LISTA DE COMPRAS</div><form class="form" onsubmit="addShop(event)"><input id="shopTitle" placeholder="Adicionar item..." /><button class="btn" type="submit">+</button></form>${shops.map(s=>`<div class="row"><button class="chk ${s.checked?'done':''}" onclick="toggleShop('${s.id}')">${s.checked?'✓':''}</button><div class="ttl ${s.checked?'done':''}">${esc(s.title)}<div class="sub">${s.category}</div></div></div>`).join("")||'<div class="sub">Lista vazia</div>'}</div>`;
  } else if(subTab==="tasks"){
    const wsTasks=(data.tasks||[]).filter(t=>(t.workspace||"work")===mod);
    el.innerHTML=`<form class="form" onsubmit="addTask(event,'${mod}')"><input id="taskInp" placeholder="Nova tarefa (${mod.toUpperCase()})..." /><button class="btn" type="submit">+</button></form><div class="card">${wsTasks.map(t=>`<div class="row"><button class="chk ${t.completed?'done':''}" onclick="toggleTask('${t.id}')">${t.completed?'✓':''}</button><div class="ttl ${t.completed?'done':''}">${esc(t.title)}<div class="sub">${[t.dueDate,t.dueTime,t.category].filter(Boolean).join(" • ")}</div></div></div>`).join("")||'<div class="sub">Nenhuma tarefa neste módulo</div>'}</div>`;
  } else if(subTab==="systems"){
    const syss=data.systems||[];
    el.innerHTML='<div class="card"><div class="sub" style="margin-bottom:6px">SISTEMAS CDHU</div>'+syss.map(s=>`<div class="row"><div class="ttl">${esc(s.name)}<div class="sub">${esc(s.detail)}</div></div><b style="color:${s.online?'#9AF549':'#F87171'};font-size:11px">${s.online?'ONLINE':'OFFLINE'}</b></div>`).join("")+'</div>';
  } else if(subTab==="agenda"){
    const rems=data.reminders||[], habs=data.habits||[];
    el.innerHTML='<div class="card"><div class="sub" style="margin-bottom:6px">LEMBRETES</div>'+(rems.map(r=>`<div class="row"><div class="ttl">${esc(r.title)}<div class="sub">${new Date(r.triggerAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></div></div>`).join("")||'<div class="sub">Sem lembretes</div>')+'</div><div class="card"><div class="sub" style="margin-bottom:6px">HÁBITOS DE HOJE</div>'+habs.map(h=>`<div class="row"><button class="chk ${h.doneToday?'done':''}" onclick="checkinHabit('${h.id}')">${h.doneToday?'✓':''}</button><div class="ttl">${esc(h.title)}</div></div>`).join("")+'</div>';
  } else if(subTab==="leads"){
    const leads=data.leads||[];
    el.innerHTML=`<div class="card"><div class="sub" style="margin-bottom:6px">LEADS & CLIENTES (${leads.length})</div><form class="form" onsubmit="addLead(event)"><input id="leadName" placeholder="Nome..." style="flex:2" /><input id="leadBiz" placeholder="Nicho" /><input id="leadVal" type="number" placeholder="R$" /><button class="btn btn-dev" type="submit">+</button></form>${leads.map(l=>`<div class="row"><div class="ttl">${esc(l.name)}${l.business?' ('+esc(l.business)+')':''}<div class="sub">${esc(l.projectType)} • ${esc(l.status)} • ${fmtBrl(l.estimatedValue)}</div></div></div>`).join("")||'<div class="sub">Sem leads ainda</div>'}</div>`;
  } else if(subTab==="reels"){
    const reels=data.reels||[];
    el.innerHTML=`<div class="card"><div class="sub" style="margin-bottom:6px">IDEIAS DE REELS (${reels.length})</div><form class="form" onsubmit="addReel(event)"><input id="reelTitle" placeholder="Ideia..." style="flex:2" /><input id="reelHook" placeholder="Gancho 3s" /><button class="btn btn-dev" type="submit">+</button></form>${reels.map(r=>`<div class="row"><div class="ttl">${esc(r.title)}<div class="sub">${esc(r.hook)} • ${esc(r.status)}</div></div></div>`).join("")||'<div class="sub">Sem ideias de Reels</div>'}</div>`;
  } else if(subTab==="pc"){
    const rep=data.lastMobileReply;
    el.innerHTML=`<div class="card"><div class="sub" style="margin-bottom:6px">ENVIAR COMANDO AO DRAKARS</div><form class="form" onsubmit="sendCmd(event)"><input id="cmdInp" placeholder="Ex: criar tarefa revisar chamado CDHU..." /><button class="btn" type="submit">Enviar</button></form>${rep?'<div class="sub" style="margin-top:6px"><b>'+esc(rep.prompt)+'</b><br><span style="color:#fff">'+esc(rep.reply)+'</span></div>':''}</div>`;
  }
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
sync();
setInterval(()=>{ if(!document.hidden) sync(); }, 10000);
</script>
</body>
</html>
