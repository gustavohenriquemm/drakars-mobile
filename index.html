<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0E1013" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="manifest" href="./manifest.json" />
<title>Drakars</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0E1013;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 82px;min-height:100vh}
  .card{background:#16191E;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:10px}
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
  .dot{width:9px;height:9px;border-radius:50%;background:#7EE823;box-shadow:0 0 8px #7EE823}
  .dot.pc-off{background:#F59E0B;box-shadow:0 0 8px #F59E0B}
  .pill{background:#233217;color:#9AF549;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600}
  .row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#1D2128;margin-bottom:6px}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;color:#000;font-weight:900;font-size:13px}
  .chk.done{background:#7EE823;border-color:#7EE823}
  .ttl{font-size:14px;font-weight:600;flex:1;min-width:0}
  .ttl.done{text-decoration:line-through;color:rgba(255,255,255,.45)}
  .sub{font-size:11px;color:rgba(255,255,255,.52);margin-top:2px}
  .form{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  input,select{flex:1;min-width:80px;background:#111318;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 11px;color:#fff;font-size:13px;outline:none}
  .btn{background:#7EE823;color:#000;border:none;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .btn2{background:rgba(255,255,255,.09);color:#fff;border:none;border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer}
  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .kpi{background:#1D2128;border-radius:12px;padding:8px;text-align:center}
  .kpi .lbl{font-size:10px;color:rgba(255,255,255,.55)}
  .kpi .val{font-size:13px;font-weight:700;margin-top:2px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111317;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding:8px 4px}
  .nav button{background:none;border:none;color:rgba(255,255,255,.55);font-size:11px;font-weight:600;padding:7px 8px;border-radius:10px}
  .nav button.act{background:#233217;color:#9AF549}
  .badge-on{color:#9AF549;font-size:11px;font-weight:700}
  .badge-off{color:#F87171;font-size:11px;font-weight:700}
  .banner{font-size:11px;color:#FCD34D;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:8px 10px;margin-bottom:10px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="brand">
      <img src="./icon.svg" width="24" height="24" alt="" style="border-radius:6px" />
      <span>Drakars</span>
      <span class="dot" id="pcDot" title="Status do PC"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn2" onclick="sync()">↻</button>
      <span class="pill" id="lvl">Nv1 • 0</span>
    </div>
  </div>
  <div id="banner"></div>
  <div id="content"></div>
  <div class="nav">
    <button class="act" onclick="setTab('tasks',this)">Tarefas</button>
    <button onclick="setTab('home',this)">🏠 Casa</button>
    <button onclick="setTab('agenda',this)">Agenda</button>
    <button onclick="setTab('systems',this)">Sistemas</button>
    <button onclick="setTab('pc',this)">Drakars</button>
  </div>
<script>
const CFG_KEY="drakars_cloud_cfg";
const DATA_KEY="drakars_cloud_data";
let tab="tasks", cfg=null, data=null, filter="pending";

function readConfig(){
  if(location.hash && location.hash.length>1){
    const p=new URLSearchParams(location.hash.slice(1));
    const gistId=p.get("gist"), token=p.get("token");
    if(gistId && token){
      const next={gistId,token};
      localStorage.setItem(CFG_KEY, JSON.stringify(next));
      history.replaceState(null,"",location.pathname+location.search);
      return next;
    }
  }
  try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch{ return null; }
}

cfg=readConfig();
try{ const cached=localStorage.getItem(DATA_KEY); if(cached) data=JSON.parse(cached); }catch{}

if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }

function setTab(t,el){
  tab=t;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("act"));
  if(el) el.classList.add("act");
  render();
}

async function fetchGist(){
  if(!cfg) return null;
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{
    cache:"no-store",
    headers:{
      Accept:"application/vnd.github+json",
      Authorization:"Bearer "+cfg.token
    }
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const g=await r.json();
  const txt=g.files && g.files["drakars-sync.json"] && g.files["drakars-sync.json"].content;
  return txt ? JSON.parse(txt) : null;
}

async function patchGist(nextData){
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{
    method:"PATCH",
    headers:{
      Accept:"application/vnd.github+json",
      Authorization:"Bearer "+cfg.token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({files:{"drakars-sync.json":{content:JSON.stringify(nextData,null,2)}}})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
}

async function sync(){
  if(!cfg){ render(); return; }
  try{
    const remote=await fetchGist();
    if(remote){
      data=remote;
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    }
    render();
  }catch(e){
    render("Modo offline (usando cache local).");
  }
}

async function pushOp(type, payload, mutateLocal){
  if(!cfg || !data) return;
  const fresh=(await fetchGist().catch(()=>null)) || data;
  mutateLocal(fresh);
  fresh.pendingMobileOps = Array.isArray(fresh.pendingMobileOps) ? fresh.pendingMobileOps : [];
  fresh.pendingMobileOps.push({
    id: Date.now()+"-"+Math.random().toString(36).slice(2,8),
    type,
    payload,
    createdAt: Date.now()
  });
  fresh.updatedAt = Date.now();
  data = fresh;
  localStorage.setItem(DATA_KEY, JSON.stringify(data));
  render();
  await patchGist(fresh);
}

async function addTask(e){
  e.preventDefault();
  const inp=document.getElementById("taskInp");
  const title=inp ? inp.value.trim() : "";
  if(!title) return;
  inp.value="";
  const newId="mob-"+Date.now();
  await pushOp("create_task",{title,category:"Celular"},(d)=>{
    d.tasks=d.tasks||[];
    d.tasks.unshift({id:newId,title,priority:"medium",category:"Celular",completed:false});
  });
}

async function toggleTask(id){
  await pushOp("toggle_task",{id},(d)=>{
    d.tasks=(d.tasks||[]).map(t=>t.id===id?{...t,completed:!t.completed}:t);
  });
}

async function checkinHabit(id){
  await pushOp("checkin_habit",{id},(d)=>{
    d.habits=(d.habits||[]).map(h=>h.id===id?{...h,doneToday:!h.doneToday}:h);
  });
}

async function addTx(e){
  e.preventDefault();
  const title=document.getElementById("txTitle").value.trim();
  const amount=parseFloat(String(document.getElementById("txAmount").value).replace(",","."));
  const type=document.getElementById("txType").value;
  const owner=document.getElementById("txOwner").value;
  if(!title || isNaN(amount) || amount<=0) return;
  document.getElementById("txTitle").value="";
  document.getElementById("txAmount").value="";
  const date=new Date().toISOString().slice(0,10);
  await pushOp("add_transaction",{title,amount,type,owner,date,category:"Celular"},(d)=>{
    d.transactions=d.transactions||[];
    d.transactions.unshift({id:"tx-"+Date.now(),title,amount,type,owner,date,category:"Celular",paid:true});
  });
}

async function addCal(e){
  e.preventDefault();
  const title=document.getElementById("calTitle").value.trim();
  const date=document.getElementById("calDate").value || new Date().toISOString().slice(0,10);
  const time=document.getElementById("calTime").value || "";
  if(!title) return;
  document.getElementById("calTitle").value="";
  await pushOp("add_calendar_event",{title,date,time,category:"casal",person:"casal"},(d)=>{
    d.calendarEvents=d.calendarEvents||[];
    d.calendarEvents.unshift({id:"cal-"+Date.now(),title,date,time,category:"casal",person:"casal"});
  });
}

async function addShop(e){
  e.preventDefault();
  const title=document.getElementById("shopTitle").value.trim();
  if(!title) return;
  document.getElementById("shopTitle").value="";
  await pushOp("add_shopping_item",{title,category:"mercado"},(d)=>{
    d.shoppingList=d.shoppingList||[];
    d.shoppingList.unshift({id:"sh-"+Date.now(),title,category:"mercado",checked:false});
  });
}

async function toggleShop(id){
  await pushOp("toggle_shopping_item",{id},(d)=>{
    d.shoppingList=(d.shoppingList||[]).map(s=>s.id===id?{...s,checked:!s.checked}:s);
  });
}

async function sendCmd(e){
  e.preventDefault();
  const inp=document.getElementById("cmdInp");
  const text=inp ? inp.value.trim() : "";
  if(!text) return;
  inp.value="";
  await pushOp("send_chat",{text},()=>{});
  render("Comando enviado para a fila do Drakars!");
}

function saveManualCfg(e){
  e.preventDefault();
  const g=document.getElementById("cfgGist").value.trim();
  const t=document.getElementById("cfgTok").value.trim();
  if(g && t){
    cfg={gistId:g,token:t};
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    sync();
  }
}

function fmtBrl(n){ return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }

function render(warn){
  const el=document.getElementById("content");
  const ban=document.getElementById("banner");
  if(!cfg){
    ban.innerHTML="";
    el.innerHTML=`<div class="card"><div class="ttl" style="margin-bottom:8px">Parear com seu Drakars</div><div class="sub" style="margin-bottom:10px">Escaneie o QR Code na aba <b>Celular</b> do Drakars no PC, ou cole os dados abaixo:</div><form onsubmit="saveManualCfg(event)"><input id="cfgGist" placeholder="Gist ID" style="width:100%;margin-bottom:8px" /><input id="cfgTok" type="password" placeholder="GitHub Token" style="width:100%;margin-bottom:8px" /><button class="btn" type="submit" style="width:100%">Conectar</button></form></div>`;
    return;
  }
  if(!data){
    el.innerHTML='<div class="card"><div class="sub">Carregando dados da nuvem...</div></div>';
    return;
  }
  const pcOnline = data.pcLastSeenAt && (Date.now()-data.pcLastSeenAt)<70000;
  document.getElementById("pcDot").className = "dot" + (pcOnline ? "" : " pc-off");
  const pending=(data.tasks||[]).filter(t=>!t.completed);
  document.getElementById("lvl").textContent="Nv"+(data.level||1)+" • "+pending.length+" pend.";

  const msgs=[];
  if(!pcOnline) msgs.push("PC desligado/offline agora — suas mudanças ficam salvas na nuvem e sincronizam quando o PC ligar.");
  if(warn) msgs.push(warn);
  ban.innerHTML = msgs.length ? '<div class="banner">'+msgs.join("<br>")+'</div>' : '';

  if(tab==="tasks"){
    const list=(data.tasks||[]).filter(t=>filter==="all"?true:filter==="done"?t.completed:!t.completed);
    const rows=list.length?list.map(t=>`<div class="row"><button class="chk ${t.completed?'done':''}" onclick="toggleTask('${t.id}')">${t.completed?'✓':''}</button><div class="ttl ${t.completed?'done':''}">${esc(t.title)}<div class="sub">${[t.dueDate,t.dueTime,t.category].filter(Boolean).join(" • ")}</div></div></div>`).join(""):'<div class="sub" style="padding:12px;text-align:center">Nenhuma tarefa aqui!</div>';
    el.innerHTML=`
      <form class="form" onsubmit="addTask(event)"><input id="taskInp" placeholder="Nova tarefa..." /><button class="btn" type="submit">+</button></form>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn2" style="${filter==='pending'?'background:#233217;color:#9AF549':''}" onclick="filter='pending';render()">Pendentes (${pending.length})</button>
        <button class="btn2" style="${filter==='done'?'background:#233217;color:#9AF549':''}" onclick="filter='done';render()">Feitas</button>
        <button class="btn2" style="${filter==='all'?'background:#233217;color:#9AF549':''}" onclick="filter='all';render()">Todas</button>
      </div>
      <div class="card">${rows}</div>`;
  } else if(tab==="home"){
    const month=new Date().toISOString().slice(0,7);
    const partner=data.partnerName||"Esposa";
    const txs=(data.transactions||[]).filter(t=>(t.date||"").startsWith(month));
    const inc=txs.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount||0),0);
    const exp=txs.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount||0),0) + (data.recurringBills||[]).reduce((a,b)=>a+Number(b.amount||0),0);
    const bal=inc-exp;
    const today=new Date().toISOString().slice(0,10);
    const cals=(data.calendarEvents||[]).filter(c=>c.date>=today).slice(0,6);
    const shops=(data.shoppingList||[]).slice(0,15);
    const banks=data.bankAccounts||[];
    const cards=data.creditCards||[];
    const goals=data.savingsGoals||[];
    const bankColors={nubank:"#820AD1",itau:"#EC7000",bradesco:"#CC092F",santander:"#EC0000",bb:"#0038A8",caixa:"#005CA9",inter:"#FF7A00",c6:"#242424",btg:"#001E62",xp:"#111111",mercadopago:"#009EE3",picpay:"#21C25E",pagbank:"#00A868",sicredi:"#3FA110",sicoob:"#003641",wise:"#9FE870",nomad:"#C9A227"};
    el.innerHTML=`
      <div class="card">
        <div class="sub" style="margin-bottom:8px">FINANCEIRO DO CASAL (${month}) • Você & ${esc(partner)}</div>
        <div class="kpi-grid">
          <div class="kpi"><div class="lbl">Entradas</div><div class="val" style="color:#9AF549">${fmtBrl(inc)}</div></div>
          <div class="kpi"><div class="lbl">Saídas</div><div class="val" style="color:#FDA4AF">${fmtBrl(exp)}</div></div>
          <div class="kpi"><div class="lbl">Saldo</div><div class="val" style="color:${bal>=0?'#9AF549':'#F87171'}">${fmtBrl(bal)}</div></div>
        </div>
        ${(banks.length || cards.length) ? `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px">${banks.map(b=>`<div style="min-width:125px;background:#1D2128;border-left:4px solid ${bankColors[b.bankKey]||'#7EE823'};border-radius:10px;padding:7px 9px"><div class="sub" style="margin:0;color:#fff;font-weight:600">${esc(b.name)}</div><div style="font-size:12px;font-weight:700;color:#9AF549;margin-top:2px">${fmtBrl(b.balance)}</div></div>`).join("")}${cards.map(c=>`<div style="min-width:130px;background:#1D2128;border-left:4px solid ${bankColors[c.bankKey]||'#F59E0B'};border-radius:10px;padding:7px 9px"><div class="sub" style="margin:0;color:#fff;font-weight:600">💳 ${esc(c.name)}</div><div style="font-size:11px;font-weight:700;color:#FDA4AF;margin-top:2px">Fatura: ${fmtBrl(c.monthUsed)}</div></div>`).join("")}</div>` : ''}
        <form class="form" onsubmit="addTx(event)">
          <input id="txTitle" placeholder="Ex: Mercado..." style="flex:2" />
          <input id="txAmount" type="number" step="0.01" placeholder="R$" />
          <select id="txType"><option value="expense">Despesa</option><option value="income">Receita</option></select>
          <select id="txOwner"><option value="casal">Casal</option><option value="eu">Eu</option><option value="esposa">${esc(partner)}</option></select>
          <button class="btn" type="submit">Lançar</button>
        </form>
      </div>
      ${goals.length ? `<div class="card"><div class="sub" style="margin-bottom:6px">METAS DO CASAL</div>${goals.map(g=>{const pct=Math.min(100,Math.round((Number(g.currentAmount||0)/Math.max(1,Number(g.targetAmount||1)))*100));return `<div class="row" style="flex-direction:column;align-items:stretch;gap:5px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>${esc(g.icon||'🎯')} ${esc(g.title)}</span><span style="color:#9AF549">${pct}%</span></div><div style="height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${Math.max(4,pct)}%;background:linear-gradient(90deg,#FB7185,#7EE823)"></div></div><div class="sub" style="margin:0">${fmtBrl(g.currentAmount)} de ${fmtBrl(g.targetAmount)}${g.targetDate?' • '+g.targetDate:''}</div></div>`;}).join("")}</div>` : ''}
      <div class="card">
        <div class="sub" style="margin-bottom:6px">CALENDÁRIO PESSOAL & CASAL</div>
        <form class="form" onsubmit="addCal(event)">
          <input id="calTitle" placeholder="Compromisso..." style="flex:2" />
          <input id="calDate" type="date" value="${today}" />
          <input id="calTime" type="time" />
          <button class="btn" type="submit">+</button>
        </form>
        ${cals.length ? cals.map(c=>`<div class="row"><div class="ttl">📅 ${esc(c.title)}<div class="sub">${c.date}${c.time?' • '+c.time:''} • ${c.person}</div></div></div>`).join("") : '<div class="sub">Sem próximos eventos</div>'}
      </div>
      <div class="card">
        <div class="sub" style="margin-bottom:6px">LISTA DE COMPRAS</div>
        <form class="form" onsubmit="addShop(event)"><input id="shopTitle" placeholder="Adicionar item..." /><button class="btn" type="submit">+</button></form>
        ${shops.length ? shops.map(s=>`<div class="row"><button class="chk ${s.checked?'done':''}" onclick="toggleShop('${s.id}')">${s.checked?'✓':''}</button><div class="ttl ${s.checked?'done':''}">${esc(s.title)}<div class="sub">${s.category}${s.quantity?' • '+s.quantity:''}</div></div></div>`).join("") : '<div class="sub">Lista vazia</div>'}
      </div>`;
  } else if(tab==="agenda"){
    const rems=(data.reminders||[]).length?data.reminders.map(r=>`<div class="row"><div class="ttl">🔔 ${esc(r.title)}<div class="sub">${new Date(r.triggerAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div></div></div>`).join(""):'<div class="sub">Sem lembretes ativos</div>';
    const habs=(data.habits||[]).map(h=>`<div class="row"><button class="chk ${h.doneToday?'done':''}" onclick="checkinHabit('${h.id}')">${h.doneToday?'✓':''}</button><div class="ttl">${h.icon} ${esc(h.title)}</div></div>`).join("");
    el.innerHTML='<div class="card"><div class="sub" style="margin-bottom:6px">LEMBRETES</div>'+rems+'</div><div class="card"><div class="sub" style="margin-bottom:6px">HÁBITOS DE HOJE</div>'+habs+'</div>';
  } else if(tab==="systems"){
    const syss=(data.systems||[]).map(s=>`<div class="row"><div class="ttl">${esc(s.name)}<div class="sub">${esc(s.category)} • ${esc(s.detail)}</div></div><span class="${s.online?'badge-on':'badge-off'}">${s.online?'ONLINE':'OFFLINE'}</span></div>`).join("");
    const onCount=(data.systems||[]).filter(s=>s.online).length;
    el.innerHTML='<div class="card"><div class="sub" style="margin-bottom:6px">SISTEMAS ('+onCount+'/'+(data.systems||[]).length+' ON)</div>'+syss+'</div>';
  } else if(tab==="pc"){
    const rep=data.lastMobileReply;
    el.innerHTML=`
      <div class="card">
        <div class="sub" style="margin-bottom:6px">ENVIAR COMANDO AO DRAKARS (NO PC)</div>
        <form class="form" onsubmit="sendCmd(event)"><input id="cmdInp" placeholder="Ex: gastei 120 no mercado..." /><button class="btn" type="submit">Enviar</button></form>
        ${rep ? '<div class="sub" style="margin-top:6px"><b>'+esc(rep.prompt)+'</b><br><span style="color:#fff">'+esc(rep.reply)+'</span></div>' : ''}
      </div>
      <div class="card">
        <div class="sub">Última sincronização do PC: ${data.pcLastSeenAt ? new Date(data.pcLastSeenAt).toLocaleString("pt-BR") : "-"}</div>
      </div>`;
  }
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
sync();
setInterval(()=>{ if(!document.hidden) sync(); }, 10000);
</script>
</body>
</html>
