<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#7B2C1B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nós no Azul • Gasto Rápido</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #FAF5F0;
      --card: #FFFFFF;
      --ink: #2B1710;
      --ink-soft: #5D4035;
      --muted: #8E7469;
      --border: rgba(138, 66, 44, 0.14);
      --terracotta: #7B2C1B;
      --terracotta-2: #B6492D;
      --peach: #FCEEE6;
      --green: #18794E;
      --green-bg: #E6F4EC;
      --red: #C6362C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(640px 420px at 90% 0%, rgba(222, 112, 75, 0.14), transparent 65%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px 14px 36px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .hidden { display: none !important; }
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--terracotta), #5C1D11);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px -8px rgba(109, 36, 22, 0.55);
      flex-shrink: 0;
    }
    .brand-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .panel-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--terracotta);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(72, 28, 14, 0.05);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 10px 30px -18px rgba(72, 28, 14, 0.16);
    }
    .lbl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .amt-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFF9F5;
      border: 1.8px solid rgba(182, 73, 45, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .amt-prefix {
      font-size: 22px;
      font-weight: 800;
      color: var(--terracotta-2);
    }
    .amt-input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 32px;
      font-weight: 800;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .input, .select {
      width: 100%;
      border: 1px solid var(--border);
      background: #FFFDFB;
      border-radius: 13px;
      padding: 11px 13px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      font-family: inherit;
    }
    .input:focus, .select:focus {
      border-color: var(--terracotta-2);
    }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    @media (max-width: 420px) {
      .grid4 { grid-template-columns: repeat(2, 1fr); }
    }
    .chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #FFFDFB;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 140ms ease;
    }
    .chip.act {
      background: var(--peach);
      border-color: var(--terracotta-2);
      color: var(--terracotta);
      box-shadow: 0 4px 12px -6px rgba(182, 73, 45, 0.45);
    }
    .bank-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: #FFFDFB;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }
    .bank-chip.act {
      background: var(--peach);
      border-color: var(--terracotta-2);
    }
    .bank-bar {
      width: 8px;
      height: 24px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .save-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      background: linear-gradient(135deg, var(--terracotta), var(--terracotta-2));
      color: #FFF8F3;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 14px 28px -12px rgba(123, 44, 27, 0.65);
      font-family: inherit;
    }
    .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-sec {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 14px;
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
    }
    .ok-box { text-align: center; padding: 18px 8px; }
    .ok-badge {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      margin: 0 auto 12px;
      background: var(--green-bg);
      color: var(--green);
      display: grid;
      place-items: center;
    }
    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(250, 245, 240, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 24px 54px -20px rgba(72, 28, 14, 0.22);
    }
    .auth-err {
      margin-top: 8px;
      color: var(--red);
      font-size: 12.5px;
      font-weight: 700;
    }
    .ico {
      width: 15px;
      height: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ico svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <section id="authGate" class="auth-gate hidden" aria-label="Acesso protegido">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:18px">
        <div class="brand-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <path d="M4 15L16 5L28 15V26.5C28 27.6 27.1 28.5 26 28.5H6C4.9 28.5 4 27.6 4 26.5V15Z" stroke="#FFF6F0" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M16 23.2C16 23.2 10.6 19.6 10.6 15.8C10.6 13.9 12.1 12.5 13.9 12.5C14.9 12.5 15.6 13 16 13.7C16.4 13 17.1 12.5 18.1 12.5C19.9 12.5 21.4 13.9 21.4 15.8C21.4 19.6 16 23.2 16 23.2Z" fill="#FFD6B8" />
          </svg>
        </div>
        <div>
          <div class="brand-title">Nós no Azul</div>
          <div class="brand-sub">Gasto Rápido • Digite a senha uma vez</div>
        </div>
      </div>
      <form id="authForm">
        <label class="lbl" for="authPass">Senha de acesso</label>
        <input id="authPass" class="input" type="password" placeholder="Digite a senha de acesso" autocomplete="current-password" required />
        <div id="authErr" class="auth-err hidden"></div>
        <button id="authBtn" type="submit" class="save-btn" style="margin-top:14px">Desbloquear gasto rápido</button>
      </form>
    </div>
  </section>

  <div class="wrap">
    <header class="hdr">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
            <path d="M4 15L16 5L28 15V26.5C28 27.6 27.1 28.5 26 28.5H6C4.9 28.5 4 27.6 4 26.5V15Z" stroke="#FFF6F0" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M16 23.2C16 23.2 10.6 19.6 10.6 15.8C10.6 13.9 12.1 12.5 13.9 12.5C14.9 12.5 15.6 13 16 13.7C16.4 13 17.1 12.5 18.1 12.5C19.9 12.5 21.4 13.9 21.4 15.8C21.4 19.6 16 23.2 16 23.2Z" fill="#FFD6B8" />
          </svg>
        </div>
        <div>
          <div id="brandHeading" class="brand-title">Nós no Azul</div>
          <div class="brand-sub">Lançamento rápido • 2 Toques Atrás</div>
        </div>
      </div>
      <a id="panelLink" class="panel-link" href="./">
        <span>Painel Completo</span>
      </a>
    </header>

    <div id="root"></div>
  </div>

<script>
(() => {
  'use strict';

  const CLOUD_STORAGE_KEY = 'drakars_finance_cloud_v1';
  const COOKIE_CFG_KEY = 'nos_no_azul_cloud_v1';
  const IDB_NAME = 'nos_azul_persist_db';
  const CACHE_CFG_NAME = 'nos-azul-persist-cfg-v1';
  const AUTH_LOCAL_KEY = 'nos_no_azul_unlocked_v1';
  const DEFAULT_ACCESS_SHA256 = '19f800d3830135f6f454f4ae7c955b4550be49a5095d60cd6eb664fd762e93f8';

  const BANK_COLORS = {
    nubank: '#820AD1', itau: '#EC7000', bradesco: '#CC092F', santander: '#EC0000',
    bb: '#FFCC00', caixa: '#005CA9', inter: '#FF7A00', c6: '#1D1D21',
    btg: '#001E62', xp: '#111111', mercadopago: '#009EE3', picpay: '#11C76F',
    pagbank: '#00A859', sicredi: '#3FA110', sicoob: '#003641', neon: '#00A8E8',
    will: '#F7D000', stone: '#00A868', other: '#8C3320'
  };

  const SVG = {
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
    bank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v8M9 10v8M15 10v8M19 10v8M2 18h20M12 3l10 5H2l10-5z"/></svg>',
    pix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="19" cy="20" r="1.5"/><path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L22 7H6"/></svg>',
    food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.4 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.1 3 5.5l7 7Z"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
    sparkles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22a2 2 0 0 1-2.8 0l-7-7A2 2 0 0 1 1.6 13.6L2 4l9.6-.4a2 2 0 0 1 1.4.6l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
  };

  const CATS = [
    ['Mercado', 'cart'],
    ['Alimentação', 'food'],
    ['Transporte', 'car'],
    ['Moradia', 'home'],
    ['Saúde', 'heart'],
    ['Lazer', 'sparkles'],
    ['Compras', 'bag'],
    ['Outros', 'tag']
  ];

  function ico(name) {
    return `<span class="ico" aria-hidden="true">${SVG[name] || SVG.tag}</span>`;
  }

  function esc(val) {
    return String(val ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function uid() {
    return typeof crypto !== 'undefined' && crypto.randomUUID
      ? crypto.randomUUID()
      : 'tx-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function addMonthsIso(dateIso, addMonths) {
    const match = String(dateIso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return todayIso();
    const d = new Date(Number(match[1]), Number(match[2]) - 1 + addMonths, Math.min(28, Number(match[3])));
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function saveCookieCfg(next) {
    try {
      document.cookie = `${COOKIE_CFG_KEY}=${encodeURIComponent(JSON.stringify(next))}; max-age=31536000; path=/; SameSite=Lax`;
    } catch {}
  }

  function readCookieCfg() {
    try {
      const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE_CFG_KEY + '=([^;]*)'));
      if (m && m[1]) {
        const parsed = JSON.parse(decodeURIComponent(m[1]));
        if (parsed && parsed.gistId && parsed.token) return parsed;
      }
    } catch {}
    return null;
  }

  function persistAsyncStores(next) {
    saveCookieCfg(next);
    try { localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(next)); } catch {}
    try {
      if (window.indexedDB) {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('cfg')) db.createObjectStore('cfg');
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction('cfg', 'readwrite');
            tx.objectStore('cfg').put(next, 'creds');
          } catch {}
        };
      }
    } catch {}
    try {
      if ('caches' in window) {
        caches.open(CACHE_CFG_NAME).then((c) => c.put('/__nos_cfg', new Response(JSON.stringify(next)))).catch(() => undefined);
      }
    } catch {}
  }

  async function restoreAsyncCreds() {
    let found = null;
    try {
      if (window.indexedDB) {
        found = await new Promise((resolve) => {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains('cfg')) req.result.createObjectStore('cfg');
          };
          req.onerror = () => resolve(null);
          req.onsuccess = () => {
            try {
              const tx = req.result.transaction('cfg', 'readonly');
              const g = tx.objectStore('cfg').get('creds');
              g.onsuccess = () => resolve(g.result && g.result.gistId && g.result.token ? g.result : null);
              g.onerror = () => resolve(null);
            } catch { resolve(null); }
          };
        });
      }
    } catch {}
    if (!found && 'caches' in window) {
      try {
        const c = await caches.open(CACHE_CFG_NAME);
        const res = await c.match('/__nos_cfg');
        if (res) {
          const p = await res.json();
          if (p && p.gistId && p.token) found = p;
        }
      } catch {}
    }
    if (found) {
      persistAsyncStores(found);
      if (!window.location.hash.includes('gist=')) {
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search + `#gist=${encodeURIComponent(found.gistId)}&token=${encodeURIComponent(found.token)}`);
        } catch {}
      }
    }
    return found;
  }

  function readCreds() {
    const rawHash = window.location.hash && window.location.hash.length > 1 ? window.location.hash.slice(1) : '';
    const rawSearch = window.location.search && window.location.search.length > 1 ? window.location.search.slice(1) : '';
    for (const src of [rawHash, rawSearch]) {
      if (!src) continue;
      const p = new URLSearchParams(src);
      const gistId = (p.get('gist') || '').trim();
      const token = (p.get('token') || '').trim();
      if (gistId && token) {
        const next = { gistId, token };
        persistAsyncStores(next);
        return next;
      }
    }
    let saved = null;
    try {
      const ls = JSON.parse(localStorage.getItem(CLOUD_STORAGE_KEY) || 'null');
      if (ls && ls.gistId && ls.token) saved = ls;
    } catch {}
    if (!saved) saved = readCookieCfg();
    if (saved) {
      persistAsyncStores(saved);
      if (!window.location.hash.includes('gist=')) {
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search + `#gist=${encodeURIComponent(saved.gistId)}&token=${encodeURIComponent(saved.token)}`);
        } catch {}
      }
      return saved;
    }
    return null;
  }

  function updatePanelHref() {
    const link = document.getElementById('panelLink');
    if (!link) return;
    const isDrakarsMirror = window.location.pathname.includes('drakars-mobile');
    const targetPath = isDrakarsMirror ? './financeiro.html' : './';
    const hash = window.location.hash && window.location.hash.includes('gist=')
      ? window.location.hash
      : creds
        ? `#gist=${encodeURIComponent(creds.gistId)}&token=${encodeURIComponent(creds.token)}`
        : '';
    link.setAttribute('href', targetPath + hash);
  }

  let creds = readCreds();
  let syncData = null;
  let pm = 'credit';
  let selectedTarget = '';
  let cat = 'Mercado';
  let owner = 'casal';
  let installments = 1;
  let saving = false;
  let savedInfo = null;
  let unlocked = false;

  updatePanelHref();

  function pickDefaultTarget() {
    if (!syncData) return;
    const cards = Array.isArray(syncData.creditCards) ? syncData.creditCards : [];
    const banks = Array.isArray(syncData.bankAccounts) ? syncData.bankAccounts : [];
    if (pm === 'credit' && cards.length) {
      if (!selectedTarget.startsWith('card:')) selectedTarget = 'card:' + cards[0].id;
    } else if ((pm === 'debit' || pm === 'pix') && banks.length) {
      if (!selectedTarget.startsWith('acc:')) selectedTarget = 'acc:' + banks[0].id;
    } else {
      selectedTarget = '';
    }
  }

  async function pullGist() {
    if (!creds) return;
    try {
      const r = await fetch('https://api.github.com/gists/' + creds.gistId, {
        cache: 'no-store',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: 'Bearer ' + creds.token,
        },
      });
      if (!r.ok) return;
      const g = await r.json();
      const raw = g.files && g.files['drakars-sync.json'] && g.files['drakars-sync.json'].content;
      if (raw) {
        syncData = JSON.parse(raw);
        if (syncData.financeBrandName) {
          const el = document.getElementById('brandHeading');
          if (el) el.textContent = syncData.financeBrandName;
        }
        pickDefaultTarget();
        render();
      }
    } catch {}
  }

  async function submitExpense(e) {
    e.preventDefault();
    if (!creds || saving) return;
    const amtRaw = String(document.getElementById('amtInp')?.value || '').replace(',', '.');
    const amount = parseFloat(amtRaw);
    if (isNaN(amount) || amount <= 0) {
      alert('Digite o valor gasto.');
      return;
    }
    const desc = String(document.getElementById('descInp')?.value || '').trim();
    const title = desc || cat;
    const date = todayIso();
    const accountId = selectedTarget.startsWith('acc:') ? selectedTarget.slice(4) : undefined;
    const cardId = selectedTarget.startsWith('card:') ? selectedTarget.slice(5) : undefined;
    const n = pm === 'credit' ? Math.max(1, Math.min(24, Number(installments) || 1)) : 1;
    const txId = uid();

    saving = true;
    render();
    try {
      const rGet = await fetch('https://api.github.com/gists/' + creds.gistId, {
        cache: 'no-store',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: 'Bearer ' + creds.token,
        },
      });
      if (!rGet.ok) throw new Error('HTTP ' + rGet.status);
      const g = await rGet.json();
      const fresh = JSON.parse((g.files && g.files['drakars-sync.json'] && g.files['drakars-sync.json'].content) || '{}');
      fresh.transactions = Array.isArray(fresh.transactions) ? fresh.transactions : [];
      fresh.pendingMobileOps = Array.isArray(fresh.pendingMobileOps) ? fresh.pendingMobileOps : [];

      if (n === 1) {
        const paid = pm !== 'credit';
        fresh.transactions.unshift({
          id: txId,
          title,
          amount,
          type: 'expense',
          category: cat,
          owner,
          date,
          paid,
          paymentMethod: pm,
          accountId,
          cardId,
        });
        if (cardId && Array.isArray(fresh.creditCards) && date.startsWith(todayIso().slice(0, 7))) {
          fresh.creditCards = fresh.creditCards.map((c) =>
            c.id === cardId ? { ...c, monthUsed: Number(c.monthUsed || 0) + amount } : c
          );
        }
        if (paid && accountId && Array.isArray(fresh.bankAccounts)) {
          fresh.bankAccounts = fresh.bankAccounts.map((b) =>
            b.id === accountId ? { ...b, balance: Number(b.balance || 0) - amount } : b
          );
        }
      } else {
        const baseSlice = Math.floor((amount / n) * 100) / 100;
        const remainder = Number((amount - baseSlice * n).toFixed(2));
        for (let i = 0; i < n; i++) {
          const sliceAmt = i === 0 ? Number((baseSlice + remainder).toFixed(2)) : baseSlice;
          const sliceDate = addMonthsIso(date, i);
          fresh.transactions.unshift({
            id: `${txId}-${i + 1}`,
            title: `${title} (${i + 1}/${n})`,
            amount: sliceAmt,
            type: 'expense',
            category: cat,
            owner,
            date: sliceDate,
            paid: false,
            paymentMethod: pm,
            accountId,
            cardId,
            installmentIndex: i + 1,
            installmentTotal: n,
          });
        }
      }

      fresh.pendingMobileOps.push({
        id: uid(),
        type: 'add_transaction',
        payload: {
          id: txId,
          title,
          amount,
          type: 'expense',
          category: cat,
          owner,
          date,
          paymentMethod: pm,
          accountId,
          cardId,
          installments: n,
          paid: pm !== 'credit',
        },
        createdAt: Date.now(),
      });
      fresh.updatedAt = Date.now();

      const rPatch = await fetch('https://api.github.com/gists/' + creds.gistId, {
        method: 'PATCH',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: 'Bearer ' + creds.token,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          files: { 'drakars-sync.json': { content: JSON.stringify(fresh, null, 2) } },
        }),
      });
      if (!rPatch.ok) throw new Error('HTTP ' + rPatch.status);
      syncData = fresh;
      savedInfo = { title, amount, cat, pm, installments: n };
    } catch {
      alert('Falha ao salvar na nuvem. Verifique sua conexão e tente novamente.');
    } finally {
      saving = false;
      render();
    }
  }

  function render() {
    const root = document.getElementById('root');
    if (!root || !unlocked) return;

    if (!creds) {
      root.innerHTML = `
        <div class="card">
          <div class="lbl">Nuvem não conectada</div>
          <p style="font-size:13.5px;line-height:1.5;color:var(--ink-soft)">
            Abra o link do <b>Nós no Azul</b> enviado pelo painel (ele já vem com as credenciais na URL) para sincronizar seus cartões e contas aqui.
          </p>
        </div>`;
      return;
    }

    if (savedInfo) {
      const panelUrl = document.getElementById('panelLink')?.getAttribute('href') || './';
      root.innerHTML = `
        <div class="card ok-box">
          <div class="ok-badge">${ico('check')}</div>
          <h2 style="font-family:'Fraunces',Georgia,serif;font-size:22px;margin-bottom:6px">Gasto salvo no Nós no Azul</h2>
          <p style="font-size:14px;color:var(--ink-soft);margin-bottom:18px">
            <b>${esc(savedInfo.title)}</b> • R$ ${Number(savedInfo.amount).toFixed(2).replace('.', ',')} (${esc(savedInfo.cat)}${savedInfo.installments > 1 ? ' • ' + savedInfo.installments + 'x' : ''})
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button type="button" id="anotherBtn" class="save-btn" style="width:auto;padding:12px 18px">Lançar outro gasto</button>
            <a class="btn-sec" href="${esc(panelUrl)}">Ver no Nós no Azul</a>
          </div>
        </div>`;
      document.getElementById('anotherBtn')?.addEventListener('click', () => {
        savedInfo = null;
        render();
      });
      return;
    }

    const cards = (syncData && syncData.creditCards) || [];
    const banks = (syncData && syncData.bankAccounts) || [];
    const hisName = (syncData && syncData.userName) || 'Gustavo';
    const herName = (syncData && syncData.partnerName) || 'Esposa';

    const originsHtml =
      pm === 'credit'
        ? cards.length
          ? `<div class="card">
              <span class="lbl">Qual cartão?</span>
              <div class="grid2">
                ${cards
                  .map(
                    (c) => `
                    <button type="button" class="bank-chip ${selectedTarget === 'card:' + c.id ? 'act' : ''}" data-target="card:${esc(c.id)}">
                      <span class="bank-bar" style="background:${BANK_COLORS[c.bankKey] || '#7B2C1B'}"></span>
                      <span>${esc(c.name)}</span>
                    </button>`
                  )
                  .join('')}
              </div>
            </div>`
          : ''
        : pm === 'debit' || pm === 'pix'
          ? banks.length
            ? `<div class="card">
                <span class="lbl">De qual banco?</span>
                <div class="grid2">
                  ${banks
                    .map(
                      (b) => `
                      <button type="button" class="bank-chip ${selectedTarget === 'acc:' + b.id ? 'act' : ''}" data-target="acc:${esc(b.id)}">
                        <span class="bank-bar" style="background:${BANK_COLORS[b.bankKey] || '#18794E'}"></span>
                        <span>${esc(b.name)}</span>
                      </button>`
                    )
                    .join('')}
                </div>
              </div>`
            : ''
          : '';

    root.innerHTML = `
      <form id="quickForm">
        <div class="card">
          <span class="lbl">Valor gasto agora</span>
          <div class="amt-box">
            <span class="amt-prefix">R$</span>
            <input id="amtInp" class="amt-input" type="text" inputmode="decimal" placeholder="0,00" autofocus />
          </div>
          <div style="margin-top:10px">
            <input id="descInp" class="input" placeholder="Onde gastou? (ex.: Mercado, Farmácia, Almoço)" />
          </div>
        </div>

        <div class="card">
          <span class="lbl">Forma de pagamento</span>
          <div class="grid4">
            <button type="button" class="chip ${pm === 'credit' ? 'act' : ''}" data-pm="credit">${ico('card')}<span>Crédito</span></button>
            <button type="button" class="chip ${pm === 'debit' ? 'act' : ''}" data-pm="debit">${ico('bank')}<span>Débito</span></button>
            <button type="button" class="chip ${pm === 'pix' ? 'act' : ''}" data-pm="pix">${ico('pix')}<span>Pix</span></button>
            <button type="button" class="chip ${pm === 'cash' ? 'act' : ''}" data-pm="cash">${ico('cash')}<span>Dinheiro</span></button>
          </div>
          ${
            pm === 'credit'
              ? `<div style="margin-top:10px">
                  <select id="instSel" class="select">
                    ${[1, 2, 3, 4, 5, 6, 8, 10, 12]
                      .map((n) => `<option value="${n}" ${installments === n ? 'selected' : ''}>${n === 1 ? 'À vista (1x na fatura)' : 'Parcelado em ' + n + 'x'}</option>`)
                      .join('')}
                  </select>
                </div>`
              : ''
          }
        </div>

        ${originsHtml}

        <div class="card">
          <span class="lbl">Categoria</span>
          <div class="grid4">
            ${CATS.map(
              ([name, iconName]) => `
              <button type="button" class="chip ${cat === name ? 'act' : ''}" data-cat="${esc(name)}">
                ${ico(iconName)}<span>${esc(name)}</span>
              </button>`
            ).join('')}
          </div>
          <span class="lbl" style="margin-top:12px">De quem é o gasto?</span>
          <div class="grid3">
            <button type="button" class="chip ${owner === 'casal' ? 'act' : ''}" data-owner="casal">Casal</button>
            <button type="button" class="chip ${owner === 'eu' ? 'act' : ''}" data-owner="eu">${esc(hisName)}</button>
            <button type="button" class="chip ${owner === 'esposa' ? 'act' : ''}" data-owner="esposa">${esc(herName)}</button>
          </div>
        </div>

        <button type="submit" class="save-btn" ${saving ? 'disabled' : ''}>
          ${saving ? 'Salvando no Nós no Azul...' : 'Salvar Gasto'}
        </button>
      </form>
    `;

    document.getElementById('quickForm')?.addEventListener('submit', submitExpense);
    document.getElementById('instSel')?.addEventListener('change', (ev) => {
      installments = Number(ev.target.value) || 1;
    });
    root.querySelectorAll('[data-pm]').forEach((btn) =>
      btn.addEventListener('click', () => {
        pm = btn.getAttribute('data-pm') || 'credit';
        selectedTarget = '';
        pickDefaultTarget();
        render();
      })
    );
    root.querySelectorAll('[data-target]').forEach((btn) =>
      btn.addEventListener('click', () => {
        selectedTarget = btn.getAttribute('data-target') || '';
        render();
      })
    );
    root.querySelectorAll('[data-cat]').forEach((btn) =>
      btn.addEventListener('click', () => {
        cat = btn.getAttribute('data-cat') || 'Outros';
        render();
      })
    );
    root.querySelectorAll('[data-owner]').forEach((btn) =>
      btn.addEventListener('click', () => {
        owner = btn.getAttribute('data-owner') || 'casal';
        render();
      })
    );
  }

  async function computeSha256Hex(text) {
    if (window.crypto && window.crypto.subtle && typeof TextEncoder !== 'undefined') {
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text || '')));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }
    return '';
  }

  async function enterUnlocked() {
    unlocked = true;
    document.getElementById('authGate')?.classList.add('hidden');
    if (!creds) {
      const restored = await restoreAsyncCreds();
      if (restored) {
        creds = restored;
        updatePanelHref();
      }
    }
    render();
    pullGist();
  }

  async function boot() {
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => undefined);
    }

    let serverAuth = false;
    if (window.location.protocol.startsWith('http')) {
      try {
        const res = await fetch('/api/auth/session', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (typeof data.authenticated === 'boolean') {
            serverAuth = true;
            if (data.authenticated) {
              enterUnlocked();
              return;
            }
          }
        }
      } catch {}
    }

    if (!serverAuth) {
      try {
        if (localStorage.getItem(AUTH_LOCAL_KEY) === DEFAULT_ACCESS_SHA256) {
          enterUnlocked();
          return;
        }
      } catch {}
    }

    const gate = document.getElementById('authGate');
    gate?.classList.remove('hidden');

    document.getElementById('authForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inp = document.getElementById('authPass');
      const err = document.getElementById('authErr');
      const btn = document.getElementById('authBtn');
      const password = inp && inp.value ? inp.value.trim() : '';
      if (!password) return;
      if (err) err.classList.add('hidden');
      if (btn) btn.disabled = true;

      let ok = false;
      if (serverAuth) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          ok = res.ok;
        } catch {}
      } else {
        const hex = await computeSha256Hex(password);
        if (hex === DEFAULT_ACCESS_SHA256) {
          ok = true;
          try {
            localStorage.setItem(AUTH_LOCAL_KEY, DEFAULT_ACCESS_SHA256);
          } catch {}
        }
      }

      if (btn) btn.disabled = false;
      if (ok) {
        enterUnlocked();
      } else if (err) {
        err.textContent = 'Senha incorreta.';
        err.classList.remove('hidden');
      }
    });
  }

  boot();
})();
</script>
