<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0E1013" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<title>Drakars Widget 4x2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0E1013;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:10px;height:100vh;overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;background:#7EE823}
  .gbtn{background:#FB7185;color:#fff;text-decoration:none;border-radius:99px;padding:4px 10px;font-size:10.5px;font-weight:800}
  .grid{display:grid;grid-template-columns:1.05fr 1.2fr;gap:8px;flex:1;min-height:0}
  .panel{background:#16191E;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .lbl{font-size:9.5px;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase}
  .big{font-size:16px;font-weight:800;margin:2px 0}
  .mini{font-size:10px;display:flex;justify-content:space-between;color:rgba(255,255,255,.72)}
  .row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;background:#1D2128;margin-bottom:4px}
  .chk{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(255,255,255,.4);background:transparent;flex-shrink:0;cursor:pointer}
  .ttl{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="./icon.svg" width="16" height="16" alt="" /><span>Drakars</span><span class="dot" id="dot"></span></div>
    <a class="gbtn" id="glink" href="./gasto.html">+ Gasto R$</a>
  </div>
  <div class="grid">
    <div class="panel" id="finPanel"></div>
    <div class="panel" id="taskPanel"></div>
  </div>
<script>
const CFG_KEY="drakars_cloud_cfg", DATA_KEY="drakars_cloud_data";
function readCfg(){
  if(location.hash && location.hash.length>1){
    const p=new URLSearchParams(location.hash.slice(1));
    const gistId=p.get("gist"), token=p.get("token");
    if(gistId && token){
      const c={gistId,token};
      localStorage.setItem(CFG_KEY,JSON.stringify(c));
      history.replaceState(null,"",location.pathname+location.search);
      return c;
    }
  }
  try{return JSON.parse(localStorage.getItem(CFG_KEY)||"null");}catch{return null;}
}
let cfg=readCfg(), data=null;
try{data=JSON.parse(localStorage.getItem(DATA_KEY)||"null");}catch{}

async function getGist(){
  if(!cfg) return null;
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token}});
  const g=await r.json();
  return JSON.parse(g.files["drakars-sync.json"].content);
}
async function patchGist(d){
  await fetch("https://api.github.com/gists/"+cfg.gistId,{
    method:"PATCH",
    headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token,"Content-Type":"application/json"},
    body:JSON.stringify({files:{"drakars-sync.json":{content:JSON.stringify(d,null,2)}}})
  });
}
async function sync(){
  if(!cfg){
    document.getElementById("finPanel").innerHTML='<div class="lbl">Abra via QR Code primeiro</div>';
    return;
  }
  try{ data=await getGist(); localStorage.setItem(DATA_KEY,JSON.stringify(data)); }catch{}
  render();
}
async function toggleTask(id){
  const d=(await getGist().catch(()=>data));
  if(!d) return;
  d.tasks=(d.tasks||[]).map(t=>t.id===id?{...t,completed:!t.completed}:t);
  d.pendingMobileOps=[...(d.pendingMobileOps||[]),{id:Date.now()+"-w42",type:"toggle_task",payload:{id},createdAt:Date.now()}];
  data=d; localStorage.setItem(DATA_KEY,JSON.stringify(data)); render();
  await patchGist(d);
}
function fmtBrl(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function render(){
  if(!data) return;
  const month=new Date().toISOString().slice(0,7);
  const txs=(data.transactions||[]).filter(t=>(t.date||"").startsWith(month));
  const fixedInc=(data.fixedIncomes||[]).filter(f=>f.active!==false).reduce((a,b)=>a+Number(b.amount||0),0);
  const inc=txs.filter(t=>t.type==="income").reduce((a,b)=>a+Number(b.amount||0),0)+fixedInc;
  const exp=txs.filter(t=>t.type==="expense").reduce((a,b)=>a+Number(b.amount||0),0)+(data.recurringBills||[]).reduce((a,b)=>a+Number(b.amount||0),0);
  const bal=inc-exp;
  const banksTot=(data.bankAccounts||[]).reduce((a,b)=>a+Number(b.balance||0),0);

  document.getElementById("finPanel").innerHTML=`
    <div>
      <div class="lbl">Saldo (${month})</div>
      <div class="big" style="color:${bal>=0?'#9AF549':'#F87171'}">${fmtBrl(bal)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <div class="mini"><span>Entradas</span><b style="color:#9AF549">${fmtBrl(inc)}</b></div>
      <div class="mini"><span>Saídas</span><b style="color:#FDA4AF">${fmtBrl(exp)}</b></div>
      <div class="mini"><span>Bancos</span><b style="color:#38BDF8">${fmtBrl(banksTot)}</b></div>
    </div>`;

  const pend=(data.tasks||[]).filter(t=>!t.completed);
  document.getElementById("taskPanel").innerHTML=`
    <div class="lbl" style="margin-bottom:4px">Tarefas (${pend.length})</div>
    <div style="overflow:hidden;flex:1">${pend.slice(0,4).map(t=>`<div class="row"><button class="chk" onclick="toggleTask('${t.id}')"></button><div class="ttl">${String(t.title).replace(/</g,"&lt;")}</div></div>`).join("")||'<div class="lbl" style="margin-top:14px">Tudo em dia!</div>'}</div>`;
}
render();
sync();
setInterval(sync, 15000);
</script>
</body>
</html>
