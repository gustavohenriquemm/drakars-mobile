<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0E1013" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<title>Drakars Widget</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0E1013;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:10px}
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
  .pill{background:#233217;color:#9AF549;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
  .row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:#16191E;border:1px solid rgba(255,255,255,.06);margin-bottom:5px}
  .chk{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#000;font-weight:900;font-size:11px;flex-shrink:0;cursor:pointer}
  .chk.done{background:#7EE823;border-color:#7EE823}
  .ttl{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .form{display:flex;gap:5px;margin-bottom:8px}
  input{flex:1;background:#16191E;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 9px;color:#fff;font-size:12px;outline:none}
  .btn{background:#7EE823;color:#000;border:none;border-radius:10px;padding:7px 11px;font-weight:800;font-size:12px;cursor:pointer}
  .sub{font-size:11px;color:rgba(255,255,255,.5);text-align:center;padding:8px}
</style>
</head>
<body>
  <div class="hdr">
    <div class="brand"><img src="./icon.svg" width="18" height="18" alt="" /><span>Drakars</span></div>
    <span class="pill" id="cnt">0 pend.</span>
  </div>
  <form class="form" onsubmit="addTask(event)">
    <input id="inp" placeholder="Nova tarefa..." />
    <button class="btn" type="submit">+</button>
  </form>
  <div id="list"></div>
<script>
const CFG_KEY="drakars_cloud_cfg", DATA_KEY="drakars_cloud_data";
function readCfg(){
  if(location.hash && location.hash.length>1){
    const p=new URLSearchParams(location.hash.slice(1));
    const gistId=p.get("gist"), token=p.get("token");
    if(gistId && token){
      const c={gistId,token};
      localStorage.setItem(CFG_KEY,JSON.stringify(c));
      history.replaceState(null,"",location.pathname+location.search);
      return c;
    }
  }
  try{return JSON.parse(localStorage.getItem(CFG_KEY)||"null");}catch{return null;}
}
let cfg=readCfg(), data=null;
try{data=JSON.parse(localStorage.getItem(DATA_KEY)||"null");}catch{}

async function getGist(){
  if(!cfg) return null;
  const r=await fetch("https://api.github.com/gists/"+cfg.gistId,{cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token}});
  const g=await r.json();
  return JSON.parse(g.files["drakars-sync.json"].content);
}
async function patchGist(d){
  await fetch("https://api.github.com/gists/"+cfg.gistId,{
    method:"PATCH",
    headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+cfg.token,"Content-Type":"application/json"},
    body:JSON.stringify({files:{"drakars-sync.json":{content:JSON.stringify(d,null,2)}}})
  });
}
async function sync(){
  if(!cfg){document.getElementById("list").innerHTML='<div class="sub">Abra primeiro pelo QR Code.</div>';return;}
  try{
    data=await getGist();
    localStorage.setItem(DATA_KEY,JSON.stringify(data));
  }catch{}
  render();
}
async function addTask(e){
  e.preventDefault();
  const inp=document.getElementById("inp");
  const title=inp.value.trim();
  if(!title||!cfg) return;
  inp.value="";
  const d=(await getGist().catch(()=>data))||{tasks:[],pendingMobileOps:[]};
  d.tasks=[{id:"mob-"+Date.now(),title,priority:"medium",category:"Widget",completed:false},...(d.tasks||[])];
  d.pendingMobileOps=[...(d.pendingMobileOps||[]),{id:Date.now()+"-w",type:"create_task",payload:{title,category:"Widget"},createdAt:Date.now()}];
  data=d; localStorage.setItem(DATA_KEY,JSON.stringify(data)); render();
  await patchGist(d);
}
async function toggleTask(id){
  const d=(await getGist().catch(()=>data));
  if(!d) return;
  d.tasks=(d.tasks||[]).map(t=>t.id===id?{...t,completed:!t.completed}:t);
  d.pendingMobileOps=[...(d.pendingMobileOps||[]),{id:Date.now()+"-t",type:"toggle_task",payload:{id},createdAt:Date.now()}];
  data=d; localStorage.setItem(DATA_KEY,JSON.stringify(data)); render();
  await patchGist(d);
}
function render(){
  if(!data) return;
  const pend=(data.tasks||[]).filter(t=>!t.completed);
  document.getElementById("cnt").textContent=pend.length+" pend.";
  document.getElementById("list").innerHTML=pend.slice(0,8).map(t=>'<div class="row"><button class="chk" onclick="toggleTask(\''+t.id+'\')"></button><div class="ttl">'+t.title.replace(/</g,"&lt;")+'</div></div>').join("")||'<div class="sub">Sem tarefas pendentes!</div>';
}
render();
sync();
setInterval(sync, 15000);
</script>
</body>
</html>
