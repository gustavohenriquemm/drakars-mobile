<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#7B2C1B" />
  <title>Nós no Azul • Financeiro do Casal</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./financeiro.css" />
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="app-shell">
    <!-- Left Terracotta Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="brand-box">
        <div class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <path
              d="M4 15L16 5L28 15V26.5C28 27.6 27.1 28.5 26 28.5H6C4.9 28.5 4 27.6 4 26.5V15Z"
              stroke="#FFF6F0"
              stroke-width="2.2"
              stroke-linejoin="round"
            />
            <path
              d="M16 23.2C16 23.2 10.6 19.6 10.6 15.8C10.6 13.9 12.1 12.5 13.9 12.5C14.9 12.5 15.6 13 16 13.7C16.4 13 17.1 12.5 18.1 12.5C19.9 12.5 21.4 13.9 21.4 15.8C21.4 19.6 16 23.2 16 23.2Z"
              fill="#FFD6B8"
            />
          </svg>
        </div>
        <div>
          <div id="brandTitle" class="brand-name">Nós no Azul</div>
          <div class="brand-sub">Finanças a dois • Drakars</div>
        </div>
      </div>

      <nav id="navList" class="nav-list">
        <button type="button" class="nav-btn active" data-tab="dashboard">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span>Dashboard</span>
        </button>
        <button type="button" class="nav-btn" data-tab="transactions">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/></svg></span><span>Transações</span>
        </button>
        <button type="button" class="nav-btn" data-tab="accounts">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg></span><span>Contas &amp; Cartões</span>
        </button>
        <button type="button" class="nav-btn" data-tab="goals">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span><span>Metas</span>
        </button>
        <button type="button" class="nav-btn" data-tab="planning">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></span><span>Planejamento</span>
        </button>
        <button type="button" class="nav-btn" data-tab="calendar">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="9.5" x2="21" y2="9.5"/></svg></span><span>Calendário</span>
        </button>
        <button type="button" class="nav-btn" data-tab="reports">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span>Relatórios</span>
        </button>
        <button type="button" class="nav-btn" data-tab="assistant">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 3v3M20.5 4.5h-3"/></svg></span><span>Assistente IA</span>
          <span class="nav-pill">Posso?</span>
        </button>
        <button type="button" class="nav-btn" data-tab="settings">
          <span class="nav-icon svg-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span><span>Configurações</span>
        </button>
      </nav>

      <!-- Decorative warm heart-wave line -->
      <svg class="sidebar-flourish" viewBox="0 0 260 110" fill="none" aria-hidden="true">
        <path
          d="M-10 82 C 45 78, 86 24, 128 34 C 154 40, 146 72, 124 68 C 102 64, 118 22, 152 24 C 188 26, 204 72, 270 76"
          stroke="#FFE1CC"
          stroke-width="2.2"
          stroke-linecap="round"
        />
      </svg>

      <div class="sidebar-footer">
        <div id="syncBadge" class="sync-badge">
          <span id="syncDot" class="sync-dot"></span>
          <span id="syncText">Conectando...</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Menu">
            <span class="svg-ico" style="width:18px;height:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></span>
          </button>
          <div>
            <div style="display:flex;align-items:center;gap:9px">
              <h1 id="greetingTitle" class="greeting-title">Olá!</h1>
              <span class="svg-ico" style="width:20px;height:20px;color:var(--coral-warm)" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5.2L19.2 10 14 12l-2 5.2L10 12 4.8 10 10 8.2Z"/></svg>
              </span>
            </div>
            <p class="greeting-sub">Aqui está a visão da vida financeira de vocês.</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="mode-switch" role="tablist" aria-label="Visão">
            <button type="button" class="mode-chip active" data-scope="casal">
              <span class="svg-ico" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
              <span>Modo Casal</span>
            </button>
            <button type="button" class="mode-chip" data-scope="eu" id="scopeHisBtn">
              <span class="svg-ico" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></span>
              <span class="scope-label">Ele</span>
            </button>
            <button type="button" class="mode-chip" data-scope="esposa" id="scopeHerBtn">
              <span class="svg-ico" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></span>
              <span class="scope-label">Ela</span>
            </button>
          </div>

          <div class="month-nav">
            <button type="button" id="prevMonthBtn" class="month-arrow" aria-label="Mês anterior">‹</button>
            <span id="monthLabel" class="month-text">Nov 2026</span>
            <button type="button" id="nextMonthBtn" class="month-arrow" aria-label="Próximo mês">›</button>
          </div>

          <button type="button" id="newTxTopBtn" class="btn-primary">
            <span class="svg-ico" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span>Lançar</span>
          </button>

          <button type="button" id="notifBellBtn" class="icon-circle-btn" aria-label="Alertas">
            <span class="svg-ico" style="width:17px;height:17px;color:var(--ink-soft)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
            <span id="notifCount" class="bell-badge hidden">0</span>
          </button>

          <button
            type="button"
            id="coupleAvatarBtn"
            class="couple-avatar-btn"
            title="Clique para editar nomes e fotos do casal"
          >
            <img id="coupleAvatarImg" src="./assets/finance/avatar-casal.jpg" alt="Casal" />
          </button>
        </div>
      </header>

      <section id="viewRoot"></section>
    </main>
  </div>

  <!-- Notification Popover -->
  <div id="notifPopover" class="notif-popover hidden"></div>

  <!-- Floating AI Advisor Orb -->
  <button type="button" id="advisorFab" class="advisor-fab">
    <span class="svg-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 3v3M20.5 4.5h-3"/></svg></span>
    <span>Posso comprar?</span>
  </button>

  <!-- Slide-over AI Advisor Drawer -->
  <aside id="advisorDrawer" class="advisor-drawer hidden" aria-label="Assistente Financeiro">
    <div
      style="padding:18px 20px;background:linear-gradient(135deg,#6D2416,#9E3B23);color:#FFF8F3;display:flex;align-items:center;justify-content:space-between"
    >
      <div>
        <div style="font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px">
          <span class="svg-ico" style="width:17px;height:17px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg></span>
          <span>Consultor Nós no Azul</span>
        </div>
        <div style="font-size:12px;opacity:.82">Simule compras e pergunte se aperta o mês</div>
      </div>
      <button
        type="button"
        id="closeAdvisorBtn"
        style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,.16);color:#FFF;display:grid;place-items:center"
        aria-label="Fechar"
      >
        <span class="svg-ico" style="width:16px;height:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
      </button>
    </div>
    <div id="drawerBody" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px"></div>
  </aside>

  <!-- Modal & Toast Containers -->
  <div id="modalRoot"></div>
  <div id="toastWrap" class="toast-wrap"></div>

  <script src="./financeiro.js" defer></script>
</body>
</html>
